name: Java CI with Gradle

# 重点②：同时监听 main 和 master 分支的推送和 PR
on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch: # 允许你手动点击按钮触发构建

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. 拉取标准代码
    - name: Checkout repository
      uses: actions/checkout@v4

    # 2. 设置 JDK 环境（该项目通常使用 Java 8 或 Java 17，这里使用兼容性较好的 JDK 17，可根据报错调整）
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    # 3. 赋予 Gradle 脚本执行权限
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    # 4. 执行在线编译构建（重点①：自动开始工作流并构建）
    - name: Build with Gradle
      run: ./gradlew build

    # 5. 收集并上传构建产物（重点①：给出可以直接下载的构建产物）
    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ViaForgePlus-Build-Artifacts
        path: build/libs/*.jar # 自动抓取编译生成的 jar 文件
        if-no-files-found: error