name: Java CI with Gradle

on:
  push:
    branches: [ main, master ] # 重点②：合并为一个 branches 列表，同时监听
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: # 允许在 Actions 页面手动点击触发，作为补充

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew build # 重点①：自动执行构建

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ViaForgePlus-Build-Artifacts # 重点①：产物统一放在这个名称下
          path: build/libs/*.jar # 重点②：合并为一个路径，抓取所有 Jar
          if-no-files-found: error