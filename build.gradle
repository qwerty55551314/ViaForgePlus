buildscript {
    repositories {
        mavenCentral()
        maven { url = "https://maven.minecraftforge.net/" }
        maven { url = "https://repo.spongepowered.org/repository/maven-public/" }
        maven { url = "https://repo.viaversion.com" }
    }
    dependencies {
        classpath "net.minecraftforge.gradle:ForgeGradle:2.1-SNAPSHOT"
        classpath "org.spongepowered:mixingradle:0.6-SNAPSHOT"
        classpath "com.github.jengelman.gradle.plugins:shadow:4.0.4"
    }
}

apply plugin: "net.minecraftforge.gradle.forge"
apply plugin: "org.spongepowered.mixin"
apply plugin: "com.github.johnrengelman.shadow"

version = "1.0.0"
group = "net.aspw.viaforgeplus"
archivesBaseName = "viaforgeplus"

sourceCompatibility = targetCompatibility = "1.8"

minecraft {
    version = "1.8.9-11.15.1.2318-1.8.9"
    runDir = "run"
    mappings = "stable_22"
    makeObfSourceJar = false
}

repositories {
    mavenCentral()
    maven { url = "https://maven.minecraftforge.net/" }
    maven { url = "https://repo.spongepowered.org/repository/maven-public/" }
    maven { url = "https://repo.viaversion.com" }
}

dependencies {
    implementation "org.spongepowered:mixin:0.7.11-SNAPSHOT"
    implementation "com.viaversion:viaversion-common:5.3.1"
    implementation "com.viaversion:viabackwards-common:5.3.1"
    implementation "com.viaversion:viarewind-common:4.0.7"
    implementation "net.raphimc:ViaLoader:3.0.1"
}

compileJava {
    options.fork = true
    def jdk17Home = System.getenv("JAVA_HOME_17_X64") ?: System.getenv("JAVA_HOME")
    options.forkOptions.executable = new File(jdk17Home, "bin/javac").absolutePath
}

mixin {
    add sourceSets.main, "mixins.viaforgeplus.refmap.json"
}

shadowJar {
    classifier = ""
}

reobf {
    shadowJar { mappings = "searge" }
}

build.dependsOn shadowJar