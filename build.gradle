buildscript {
    repositories {
        mavenCentral()
        maven { url = "https://maven.minecraftforge.net/" }
        maven { url = "https://repo.spongepowered.org/repository/maven-public/" }
        maven { url = "https://repo.viaversion.com" }
        maven { url = "https://jitpack.io/" }
    }
    dependencies {
        classpath "net.minecraftforge.gradle:ForgeGradle:2.1-SNAPSHOT"
        classpath "org.spongepowered:mixingradle:0.6-SNAPSHOT"
        classpath "com.github.johnrengelman:shadow:4.0.4"
    }
}

apply plugin: "net.minecraftforge.gradle.forge"
apply plugin: "org.spongepowered.mixin"
apply plugin: "com.github.johnrengelman.shadow"

version = "1.0.0"
group = "net.aspw.viaforgeplus"
archivesBaseName = "viaforgeplus"

sourceCompatibility = JavaVersion.VERSION_1_8
targetCompatibility = JavaVersion.VERSION_1_8
compileJava.options.encoding = "UTF-8"

minecraft {
    version = "1.8.9-11.15.1.2318-1.8.9"
    runDir = "run"
    mappings = "stable_22"
    makeObfSourceJar = false
}

repositories {
    mavenCentral()
    maven { url = "https://maven.minecraftforge.net/" }
    maven { url = "https://repo.spongepowered.org/repository/maven-public/" }
    maven { url = "https://repo.viaversion.com" }
    maven { url = "https://jitpack.io/" }
}

configurations {
    include
    implementation.extendsFrom(include)
}

dependencies {
    include("org.spongepowered:mixin:0.7.11-SNAPSHOT") {
        exclude module: "launchwrapper"
    }

    include "com.viaversion:viaversion:4.10.0"
    include "com.viaversion:viabackwards:4.10.0"
    include "com.viaversion:viarewind-universal:3.0.6"
    include "net.raphimc:ViaLoader:2.2.13"

    include "org.slf4j:slf4j-api:2.0.13"
    include "org.yaml:snakeyaml:2.2"
}

mixin {
    add sourceSets.main, "mixins.viaforgeplus.refmap.json"
}

shadowJar {
    archiveName = jar.archiveName
    configurations = [project.configurations.include]
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    classifier = ""
}

reobf {
    shadowJar { mappings = "searge" }
}

build.dependsOn shadowJar