buildscript {
    repositories {
        mavenCentral()
        maven { url = "https://maven.minecraftforge.net/" }
        maven { url = "https://repo.spongepowered.org/repository/maven-public/" }
        maven { url = "https://repo.viaversion.com" }
    }
    dependencies {
        classpath "net.minecraftforge.gradle:ForgeGradle:2.1-SNAPSHOT"
        classpath "org.spongepowered:mixingradle:0.6-SNAPSHOT"
        classpath "com.github.jengelman.gradle.plugins:shadow:4.0.4"
    }
}

apply plugin: "net.minecraftforge.gradle.forge"
apply plugin: "org.spongepowered.mixin"
apply plugin: "com.github.johnrengelman.shadow"

version = "1.0.0"
group = "net.aspw.viaforgeplus"
archivesBaseName = "viaforgeplus"

sourceCompatibility = targetCompatibility = "1.8"

minecraft {
    version = "1.8.9-11.15.1.2318-1.8.9"
    runDir = "run"
    mappings = "stable_22"
    makeObfSourceJar = false
}

repositories {
    mavenCentral()
    maven { url = "https://maven.minecraftforge.net/" }
    maven { url = "https://repo.spongepowered.org/repository/maven-public/" }
    maven { url = "https://repo.viaversion.com" }
}

configurations {
    include
    implementation.extendsFrom(include)
}

dependencies {
    // Mixin 注解处理器与运行时
    include("org.spongepowered:mixin:0.7.11-SNAPSHOT") {
        exclude module: "launchwrapper"
    }

    // ViaVersion 核心套件（Java 8 兼容版本）
    include "com.viaversion:viaversion-common:4.10.0"
    include "com.viaversion:viabackwards-common:4.10.0"
    include "com.viaversion:viarewind-common:3.0.6"

    // 关键修正：ViaLoader 降级至 2.2.x 版本，保持 com.viaversion.vialoader 包路径
    include "net.raphimc:ViaLoader:2.2.10"

    // 补充：更新检查模块依赖的 okhttp3（Java 8 兼容）
    include "com.squareup.okhttp3:okhttp:4.9.2"

    // 附加必要的 SLF4J 与 YAML 解析库
    include "org.slf4j:slf4j-api:2.0.13"
    include "org.yaml:snakeyaml:2.2"
}

compileJava {
    options.fork = true
    options.encoding = "UTF-8"
    def jdk17Home = System.getenv("JAVA_HOME_17_X64") ?: System.getenv("JAVA_HOME")
    options.forkOptions.executable = new File(jdk17Home, "bin/javac").absolutePath
}

mixin {
    add sourceSets.main, "mixins.viaforgeplus.refmap.json"
}

shadowJar {
    archiveName = jar.archiveName
    configurations = [project.configurations.include]
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    classifier = ""
}

reobf {
    shadowJar { mappings = "searge" }
}

build.dependsOn shadowJar