buildscript {
    repositories {
        maven { url = "https://maven.minecraftforge.net" }
        maven { url = "https://repo.spongepowered.org/repository/maven-public" }
        mavenCentral()
    }
    dependencies {
        classpath "net.minecraftforge.gradle:ForgeGradle:2.1-SNAPSHOT"
        classpath "org.spongepowered:mixingradle:0.6-SNAPSHOT"
        classpath "com.github.jengelman.gradle.plugins:shadow:4.0.4"
    }
}

apply plugin: "net.minecraftforge.gradle.forge"
apply plugin: "org.spongepowered.mixin"
apply plugin: "com.github.johnrengelman.shadow"

version = "1.0.0"
group = "net.aspw.viaforgeplus"
archivesBaseName = "viaforgeplus"

sourceCompatibility = targetCompatibility = compileJava.sourceCompatibility = compileJava.targetCompatibility = "1.8"

minecraft {
    version = "1.8.9-11.15.1.2318-1.8.9"
    runDir = "run"
    mappings = "stable_22"
    makeObfSourceJar = false
}

repositories {
    maven {
        name = "ViaVersion"
        url = "https://repo.viaversion.com"
    }
    maven { url = "https://repo.spongepowered.org/repository/maven-public" }
    mavenCentral()
}

dependencies {
    implementation "com.viaversion:viaversion-common:5.3.1"
    implementation "com.viaversion:viabackwards-common:5.3.1"
    implementation "com.viaversion:viarewind-common:4.0.7"
    implementation "net.raphimc:ViaLoader:3.0.1"
}

mixin {
    defaultRefmap = "mixins.viaforgeplus.refmap.json"
    refmap = "mixins.viaforgeplus.refmap.json"
}

shadowJar {
    dependencies {
        include(dependency("com.viaversion:.*"))
        include(dependency("net.raphimc:ViaLoader.*"))
    }
    classifier = ""
}

reobf {
    shadowJar { mappings = "searge" }
}

build.dependsOn shadowJar